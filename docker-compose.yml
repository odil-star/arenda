# Перед запуском: cp backend/.env.example backend/.env  (и задайте SECRET_KEY)
x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rent}
      POSTGRES_USER: ${POSTGRES_USER:-rent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rent}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rent}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  django:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi -b 0.0.0.0:8000 --workers 3 --access-logfile -"
    volumes:
      - media:/app/media
      - static:/app/staticfiles

  worker:
    <<: *backend
    command: celery -A config worker -l info

  beat:
    <<: *backend
    command: celery -A config beat -l info

  bot:
    <<: *backend
    command: python manage.py run_bot

  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/staticfiles:ro
    ports: ["80:80"]
    depends_on: [django]
    restart: unless-stopped

  # Только для разработки интерфейса
  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      # адрес API для браузера (nginx на хосте); origin фронта должен быть в CORS_ORIGINS
      VITE_API_URL: http://localhost
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    profiles: ["dev"]

volumes:
  pgdata:
  media:
  static:
