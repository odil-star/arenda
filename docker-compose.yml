# Перед запуском (подробности — README, раздел «Продакшен»):
#   cp .env.example .env                  и задайте DOMAIN, LETSENCRYPT_EMAIL, POSTGRES_PASSWORD
#   cp backend/.env.example backend/.env  и задайте SECRET_KEY, ключи платежей, токен бота
#   ./scripts/init-letsencrypt.sh         первый выпуск HTTPS-сертификата и запуск стека
x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    # Значения ниже выводятся из корневого .env и перекрывают backend/.env, чтобы не разъезжались.
    DATABASE_URL: postgres://${POSTGRES_USER:-rent}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}@db:5432/${POSTGRES_DB:-rent}
    ALLOWED_HOSTS: ${DOMAIN:?Задайте DOMAIN в .env}
    CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
    CORS_ORIGINS: https://${DOMAIN}
    FRONTEND_URL: https://${DOMAIN}
    SECURE_SSL_REDIRECT: "True"
    NUM_PROXIES: "1"
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rent}
      POSTGRES_USER: ${POSTGRES_USER:-rent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rent}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  django:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi -b 0.0.0.0:8000 --workers 3 --access-logfile -"
    volumes:
      - media:/app/media
      - static:/app/staticfiles

  worker:
    <<: *backend
    command: celery -A config worker -l info

  beat:
    <<: *backend
    command: celery -A config beat -l info

  bot:
    <<: *backend
    command: python manage.py run_bot

  # Собирает фронтенд внутрь образа и раздаёт его; проксирует /api и /admin в Django; HTTPS.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в .env}
    volumes:
      - static:/staticfiles:ro
      - certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    ports: ["80:80", "443:443"]
    depends_on: [django]
    restart: unless-stopped

  # Продление сертификата Let's Encrypt (проверка срока дважды в сутки)
  certbot:
    image: certbot/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    volumes:
      - certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    restart: unless-stopped

  # Только для разработки интерфейса
  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      # адрес API для браузера; origin фронта должен быть в CORS_ORIGINS
      VITE_API_URL: http://localhost:8000
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    profiles: ["dev"]

volumes:
  pgdata:
  media:
  static:
  certs:
  certbot_www:
